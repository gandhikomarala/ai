[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisai"
version = "1.0.0"
description = "AegisAI — Enterprise AI Knowledge & Incident Copilot"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "AegisAI Architecture Team", email = "architect@aegisai.internal" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.1",
    "pgvector>=0.2.5",
    "redis>=5.0.3",
    "celery>=5.3.6",
    "minio>=7.2.5",
    "neo4j>=5.18.0",
    "passlib[argon2,bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "openai>=1.14.0",
    "anthropic>=0.19.0",
    "tiktoken>=0.6.0",
    "numpy>=1.26.4",
    "scipy>=1.12.0",
    "pypdf>=4.1.0",
    "python-docx>=1.1.0",
    "beautifulsoup4>=4.12.3",
    "markdown>=3.6",
    "pyyaml>=6.0.1",
    "sqlglot>=23.0.0",
    "tree-sitter>=0.21.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "opentelemetry-instrumentation-fastapi>=0.44b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.44b0",
    "prometheus-client>=0.20.0",
    "langfuse>=2.21.0",
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0"
]

[project.optional-dependencies]
dev = [
    "ruff>=0.3.2",
    "black>=24.2.0",
    "isort>=5.13.2",
    "mypy>=1.9.0",
    "pre-commit>=3.6.2"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
